---
- name: Configure AWS provider ID for Kubernetes nodes
  hosts: all
  become: true
  gather_facts: false

  vars_files:
    - vars/cluster.yml

  pre_tasks:
    - name: Verify masters inventory group
      ansible.builtin.assert:
        that:
          - groups['masters'] is defined
          - groups['masters'] | length > 0
        fail_msg: >-
          The masters inventory group is missing or empty.
        success_msg: >-
          Kubernetes control plane host was found.

  tasks:
    - name: Configure Kubernetes node provider ID
      ansible.builtin.include_tasks:
        file: tasks/configure-node-provider-id.yml


- name: Verify AWS provider IDs for all Kubernetes nodes
  hosts: masters
  become: true
  gather_facts: false

  vars_files:
    - vars/cluster.yml

  tasks:
    - name: Read Kubernetes nodes
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - nodes
          - -o
          - json
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: node_provider_id_nodes
      changed_when: false

    - name: Verify provider ID for each Kubernetes node
      ansible.builtin.assert:
        that:
          - item.spec.providerID is defined
          - item.spec.providerID | length > 0
          - >-
            item.spec.providerID
            is match('^aws:///[a-z0-9-]+/i-[a-f0-9]+$')
        fail_msg: >-
          Kubernetes node {{ item.metadata.name }} does not have
          a valid AWS providerID.
        success_msg: >-
          Kubernetes node {{ item.metadata.name }} has a valid
          AWS providerID: {{ item.spec.providerID }}
      loop: "{{ (node_provider_id_nodes.stdout | from_json)['items'] }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: Show Kubernetes node provider IDs
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - nodes
          - -o
          - >-
            custom-columns=NAME:.metadata.name,STATUS:.status.conditions[-1].type,PROVIDER_ID:.spec.providerID
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: node_provider_id_result
      changed_when: false

    - name: Display Kubernetes node provider IDs
      ansible.builtin.debug:
        var: node_provider_id_result.stdout_lines