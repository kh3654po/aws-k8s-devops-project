---
- name: Verify Istio resilience traffic policies
  hosts: masters
  become: true
  gather_facts: false

  vars_files:
    - vars/cluster.yml

  tasks:
    - name: Check Kubernetes administrator kubeconfig
      ansible.builtin.stat:
        path: "{{ kubeconfig_path }}"
      register: istio_resilience_kubeconfig

    - name: Verify Kubernetes administrator kubeconfig
      ansible.builtin.assert:
        that:
          - istio_resilience_kubeconfig.stat.exists
        fail_msg: >-
          Kubernetes administrator kubeconfig was not found at
          {{ kubeconfig_path }}.

    - name: Verify Istiod is available
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - --for=condition=Available
          - deployment/istiod
          - --namespace
          - "{{ istio_namespace }}"
          - --timeout=180s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false

    - name: Verify Istio CNI DaemonSet rollout
      ansible.builtin.command:
        argv:
          - kubectl
          - rollout
          - status
          - daemonset/istio-cni-node
          - --namespace
          - "{{ istio_namespace }}"
          - --timeout=180s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false

    - name: Verify Istio test client is available
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - --for=condition=Available
          - deployment/{{ istio_test_client_app }}
          - --namespace
          - "{{ istio_test_namespace }}"
          - --timeout=180s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false

    - name: Copy resilience workload manifest
      ansible.builtin.copy:
        src: "{{ istio_resilience_workload_manifest_local_path }}"
        dest: "{{ istio_resilience_workload_manifest_remote_path }}"
        owner: root
        group: root
        mode: "0644"

    - name: Validate resilience workload manifest
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - --dry-run=server
          - --namespace
          - "{{ istio_test_namespace }}"
          - --filename
          - "{{ istio_resilience_workload_manifest_remote_path }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false

    - name: Apply resilience workload
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - --namespace
          - "{{ istio_test_namespace }}"
          - --filename
          - "{{ istio_resilience_workload_manifest_remote_path }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: istio_resilience_workload_apply
      changed_when: >-
        'created' in istio_resilience_workload_apply.stdout or
        'configured' in istio_resilience_workload_apply.stdout

    - name: Wait for resilience deployment
      ansible.builtin.command:
        argv:
          - kubectl
          - rollout
          - status
          - deployment/{{ istio_resilience_app }}
          - --namespace
          - "{{ istio_test_namespace }}"
          - --timeout=300s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false

    - name: Verify resilience workload contains istio-proxy
      ansible.builtin.shell: |
        set -o pipefail

        POD="$(
          kubectl get pods \
            --namespace {{ istio_test_namespace }} \
            --selector app={{ istio_resilience_app }} \
            --output=jsonpath='{.items[0].metadata.name}'
        )"

        CONTAINERS="$(
          kubectl get pod "${POD}" \
            --namespace {{ istio_test_namespace }} \
            --output=jsonpath='{.spec.containers[*].name}'
        )"

        INIT_CONTAINERS="$(
          kubectl get pod "${POD}" \
            --namespace {{ istio_test_namespace }} \
            --output=jsonpath='{.spec.initContainers[*].name}'
        )"

        echo "pod=${POD}"
        echo "containers=${CONTAINERS}"
        echo "initContainers=${INIT_CONTAINERS}"

        if ! grep -qx 'istio-proxy' <<< "$(
          printf '%s\n%s\n' \
            "${CONTAINERS}" \
            "${INIT_CONTAINERS}" |
          tr ' ' '\n'
        )"; then
          echo "istio-proxy was not found."
          exit 1
        fi
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false

    - name: Copy resilience policy manifest
      ansible.builtin.copy:
        src: "{{ istio_resilience_policy_manifest_local_path }}"
        dest: "{{ istio_resilience_policy_manifest_remote_path }}"
        owner: root
        group: root
        mode: "0644"

    - name: Copy circuit breaker policy manifest
      ansible.builtin.copy:
        src: "{{ istio_circuit_breaker_policy_manifest_local_path }}"
        dest: "{{ istio_circuit_breaker_policy_manifest_remote_path }}"
        owner: root
        group: root
        mode: "0644"

    - name: Validate resilience policy
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - --dry-run=server
          - --namespace
          - "{{ istio_test_namespace }}"
          - --filename
          - "{{ istio_resilience_policy_manifest_remote_path }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false

    - name: Validate circuit breaker policy
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - --dry-run=server
          - --namespace
          - "{{ istio_test_namespace }}"
          - --filename
          - "{{ istio_circuit_breaker_policy_manifest_remote_path }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false

    - name: Apply base resilience policy
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - --namespace
          - "{{ istio_test_namespace }}"
          - --filename
          - "{{ istio_resilience_policy_manifest_remote_path }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: istio_resilience_policy_apply
      changed_when: >-
        'created' in istio_resilience_policy_apply.stdout or
        'configured' in istio_resilience_policy_apply.stdout


    - name: Verify resilience backend baseline
      ansible.builtin.shell: |
        set -o pipefail

        RESPONSE="$(
          kubectl exec \
            --namespace {{ istio_test_namespace }} \
            deployment/{{ istio_test_client_app }} \
            --container {{ istio_test_client_app }} \
            -- \
            curl \
              --silent \
              --show-error \
              --fail \
              --max-time 5 \
              http://{{ istio_resilience_service }}/
        )"

        echo "response=${RESPONSE}"

        test "${RESPONSE}" = "istio-resilience-demo"
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: istio_resilience_baseline
      retries: 10
      delay: 3
      until: istio_resilience_baseline.rc == 0
      changed_when: false

    - name: Verify Envoy retries failed upstream request
      ansible.builtin.shell: |
        set -o pipefail

        RESPONSE="$(
          kubectl exec \
            --namespace {{ istio_test_namespace }} \
            deployment/{{ istio_test_client_app }} \
            --container {{ istio_test_client_app }} \
            -- \
            curl \
              --silent \
              --show-error \
              --fail \
              --max-time 5 \
              http://{{ istio_resilience_service }}/retry
        )"

        echo "response=${RESPONSE}"

        if ! grep -Fq 'status=200' <<< "${RESPONSE}"; then
          echo "Retry did not result in HTTP 200."
          exit 1
        fi

        if grep -Fq 'attempt=1' <<< "${RESPONSE}"; then
          echo "Request unexpectedly succeeded on the first attempt."
          exit 1
        fi

        echo "Retry succeeded after the first failed attempt."
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: istio_retry_test
      retries: 10
      delay: 3
      until: istio_retry_test.rc == 0
      changed_when: false

    - name: Verify Envoy request timeout
      ansible.builtin.shell: |
        set -o pipefail

        RESULT="$(
          kubectl exec \
            --namespace {{ istio_test_namespace }} \
            deployment/{{ istio_test_client_app }} \
            --container {{ istio_test_client_app }} \
            -- \
            curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code} %{time_total}' \
              --max-time 5 \
              'http://{{ istio_resilience_service }}/slow?seconds=3'
        )"

        STATUS="$(
          awk '{print $1}' <<< "${RESULT}"
        )"

        DURATION="$(
          awk '{print $2}' <<< "${RESULT}"
        )"

        echo "status=${STATUS}"
        echo "duration=${DURATION}"

        if [ "${STATUS}" != "504" ]; then
          echo "Expected HTTP 504 but received ${STATUS}."
          exit 1
        fi

        awk \
          -v duration="${DURATION}" \
          'BEGIN {
             if (duration < 0.8 || duration > 2.5) {
               exit 1
             }
          }'
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: istio_timeout_test
      retries: 10
      delay: 3
      until: istio_timeout_test.rc == 0
      changed_when: false

    - name: Verify Istio delay fault injection
      ansible.builtin.shell: |
        set -o pipefail

        RESULT="$(
          kubectl exec \
            --namespace {{ istio_test_namespace }} \
            deployment/{{ istio_test_client_app }} \
            --container {{ istio_test_client_app }} \
            -- \
            curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code} %{time_total}' \
              --max-time 5 \
              http://{{ istio_resilience_service }}/fault-delay
        )"

        STATUS="$(
          awk '{print $1}' <<< "${RESULT}"
        )"

        DURATION="$(
          awk '{print $2}' <<< "${RESULT}"
        )"

        echo "status=${STATUS}"
        echo "duration=${DURATION}"

        if [ "${STATUS}" != "200" ]; then
          echo "Expected HTTP 200 but received ${STATUS}."
          exit 1
        fi

        awk \
          -v duration="${DURATION}" \
          'BEGIN {
             if (duration < 1.8) {
               exit 1
             }
          }'
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: istio_fault_delay_test
      retries: 10
      delay: 3
      until: istio_fault_delay_test.rc == 0
      changed_when: false

    - name: Verify Istio abort fault injection
      ansible.builtin.shell: |
        set -o pipefail

        STATUS="$(
          kubectl exec \
            --namespace {{ istio_test_namespace }} \
            deployment/{{ istio_test_client_app }} \
            --container {{ istio_test_client_app }} \
            -- \
            curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --max-time 5 \
              http://{{ istio_resilience_service }}/fault-abort
        )"

        echo "status=${STATUS}"

        if [ "${STATUS}" != "503" ]; then
          echo "Expected injected HTTP 503 but received ${STATUS}."
          exit 1
        fi
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: istio_fault_abort_test
      retries: 10
      delay: 3
      until: istio_fault_abort_test.rc == 0
      changed_when: false

    - name: Verify Istio circuit breaker
      block:
        - name: Apply circuit breaker DestinationRule
          ansible.builtin.command:
            argv:
              - kubectl
              - apply
              - --namespace
              - "{{ istio_test_namespace }}"
              - --filename
              - "{{ istio_circuit_breaker_policy_manifest_remote_path }}"
          environment:
            KUBECONFIG: "{{ kubeconfig_path }}"
          register: istio_circuit_breaker_apply
          changed_when: >-
            'created' in istio_circuit_breaker_apply.stdout or
            'configured' in istio_circuit_breaker_apply.stdout

        - name: Generate concurrent requests and verify overflow
          ansible.builtin.shell: |
            set -o pipefail

            RESULT_DIR="$(
              mktemp -d
            )"

            cleanup() {
              rm -rf "${RESULT_DIR}"
            }

            trap cleanup EXIT

            for REQUEST in $(seq 1 20); do
              (
                STATUS="$(
                  kubectl exec \
                    --namespace {{ istio_test_namespace }} \
                    deployment/{{ istio_test_client_app }} \
                    --container {{ istio_test_client_app }} \
                    -- \
                    curl \
                      --silent \
                      --show-error \
                      --output /dev/null \
                      --write-out '%{http_code}' \
                      --max-time 6 \
                      'http://{{ istio_resilience_service }}/hold?seconds=3' \
                      2>/dev/null
                )"

                if [ -z "${STATUS}" ]; then
                  STATUS="000"
                fi

                printf '%s\n' "${STATUS}" \
                  > "${RESULT_DIR}/status-${REQUEST}"
              ) &
            done

            wait

            CODES="$(
              cat "${RESULT_DIR}"/status-* |
              grep -E '^[0-9]{3}$'
            )"

            SUCCESS="$(
              printf '%s\n' "${CODES}" |
              awk '
                $1 == "200" {
                  count++
                }
                END {
                  print count + 0
                }
              '
            )"

            REJECTED="$(
              printf '%s\n' "${CODES}" |
              awk '
                $1 == "503" {
                  count++
                }
                END {
                  print count + 0
                }
              '
            )"

            OTHER="$(
              printf '%s\n' "${CODES}" |
              awk '
                $1 != "200" && $1 != "503" {
                  count++
                }
                END {
                  print count + 0
                }
              '
            )"

            echo "success=${SUCCESS}"
            echo "rejected_503=${REJECTED}"
            echo "other=${OTHER}"
            echo
            echo "response_codes:"
            printf '%s\n' "${CODES}" | sort

            if [ "${REJECTED}" -lt 1 ]; then
              echo "No requests were rejected by the circuit breaker."
              exit 1
            fi

            echo "Circuit breaker overflow was observed."
          args:
            executable: /bin/bash
          environment:
            KUBECONFIG: "{{ kubeconfig_path }}"
          register: istio_circuit_breaker_test
          retries: 5
          delay: 3
          until: istio_circuit_breaker_test.rc == 0
          changed_when: false

      always:
        - name: Restore base DestinationRule after circuit breaker test
          ansible.builtin.command:
            argv:
              - kubectl
              - apply
              - --namespace
              - "{{ istio_test_namespace }}"
              - --filename
              - "{{ istio_resilience_policy_manifest_remote_path }}"
          environment:
            KUBECONFIG: "{{ kubeconfig_path }}"
          changed_when: false

    - name: Get resilience demo pods
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - pods
          - --namespace
          - "{{ istio_test_namespace }}"
          - --selector
          - app={{ istio_resilience_app }}
          - --output=wide
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: istio_resilience_pods
      changed_when: false

    - name: Get resilience VirtualService
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - virtualservice
          - "{{ istio_resilience_service }}"
          - --namespace
          - "{{ istio_test_namespace }}"
          - --output=yaml
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: istio_resilience_virtual_service
      changed_when: false

    - name: Get resilience DestinationRule
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - destinationrule
          - "{{ istio_resilience_service }}"
          - --namespace
          - "{{ istio_test_namespace }}"
          - --output=yaml
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: istio_resilience_destination_rule
      changed_when: false

    - name: Show resilience demo pods
      ansible.builtin.debug:
        msg: "{{ istio_resilience_pods.stdout_lines }}"

    - name: Show retry result
      ansible.builtin.debug:
        msg: "{{ istio_retry_test.stdout_lines }}"

    - name: Show timeout result
      ansible.builtin.debug:
        msg: "{{ istio_timeout_test.stdout_lines }}"

    - name: Show fault delay result
      ansible.builtin.debug:
        msg: "{{ istio_fault_delay_test.stdout_lines }}"

    - name: Show fault abort result
      ansible.builtin.debug:
        msg: "{{ istio_fault_abort_test.stdout_lines }}"

    - name: Show circuit breaker result
      ansible.builtin.debug:
        msg: "{{ istio_circuit_breaker_test.stdout_lines }}"