---
- name: Configure common prerequisites on new worker nodes
  import_playbook: common.yml

- name: Join new worker nodes to Kubernetes cluster
  hosts: workers
  become: true
  gather_facts: true

  vars:
    kubeconfig_path: /etc/kubernetes/admin.conf

  tasks:
    - name: Check if worker node is already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Generate fresh kubeadm join command on control plane
      ansible.builtin.command: kubeadm token create --print-join-command
      delegate_to: "{{ groups['masters'][0] }}"
      run_once: true
      register: kubeadm_join_command
      changed_when: false

    - name: Join worker node to Kubernetes cluster
      ansible.builtin.command: "{{ kubeadm_join_command.stdout }}"
      when: not kubelet_conf.stat.exists
      register: kubeadm_join_result

    - name: Ensure kubelet is enabled and started
      ansible.builtin.systemd:
        name: kubelet
        enabled: true
        state: started

    - name: Wait for worker node to become Ready
      ansible.builtin.command: >
        kubectl wait
        --for=condition=Ready
        node/{{ ansible_facts["hostname"] }}
        --timeout=300s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      delegate_to: "{{ groups['masters'][0] }}"
      changed_when: false

    - name: Get Kubernetes node status
      ansible.builtin.command: kubectl get nodes -o wide
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      delegate_to: "{{ groups['masters'][0] }}"
      run_once: true
      register: kubernetes_nodes
      changed_when: false

    - name: Show Kubernetes node status
      ansible.builtin.debug:
        msg: "{{ kubernetes_nodes.stdout_lines }}"
      run_once: true