---
- name: Configure common prerequisites on new worker nodes
  ansible.builtin.import_playbook: common.yml

- name: Join new worker nodes to Kubernetes cluster
  hosts: workers
  become: true
  gather_facts: true

  vars:
    kubeconfig_path: /etc/kubernetes/admin.conf

  tasks:
    - name: Check if worker node is already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Generate fresh kubeadm join command on control plane
      ansible.builtin.command:
        argv:
          - kubeadm
          - token
          - create
          - --print-join-command
      delegate_to: "{{ groups['masters'][0] }}"
      run_once: true
      register: kubeadm_join_command
      changed_when: false

    - name: Join worker node to Kubernetes cluster
      ansible.builtin.command:
        cmd: "{{ kubeadm_join_command.stdout }}"
      when: not kubelet_conf.stat.exists
      register: kubeadm_join_result

    - name: Ensure kubelet is enabled and started
      ansible.builtin.systemd:
        name: kubelet
        enabled: true
        state: started

    - name: Wait for worker node to become Ready
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - --for=condition=Ready
          - "node/{{ ansible_facts['hostname'] }}"
          - --timeout=300s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      delegate_to: "{{ groups['masters'][0] }}"
      changed_when: false

    - name: Configure AWS provider ID for joined worker
      ansible.builtin.include_tasks:
        file: tasks/configure-node-provider-id.yml

    - name: Wait for Calico DaemonSet rollout
      ansible.builtin.command:
        argv:
          - kubectl
          - rollout
          - status
          - daemonset/calico-node
          - --namespace
          - calico-system
          - --timeout=300s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      delegate_to: "{{ groups['masters'][0] }}"
      run_once: true
      changed_when: false

    - name: Wait for kube-proxy DaemonSet rollout
      ansible.builtin.command:
        argv:
          - kubectl
          - rollout
          - status
          - daemonset/kube-proxy
          - --namespace
          - kube-system
          - --timeout=300s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      delegate_to: "{{ groups['masters'][0] }}"
      run_once: true
      changed_when: false

    - name: Get Kubernetes node status
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - nodes
          - -o
          - wide
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      delegate_to: "{{ groups['masters'][0] }}"
      run_once: true
      register: kubernetes_nodes
      changed_when: false

    - name: Get Kubernetes node provider IDs
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - nodes
          - -o
          - custom-columns=NAME:.metadata.name,PROVIDER_ID:.spec.providerID
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      delegate_to: "{{ groups['masters'][0] }}"
      run_once: true
      register: kubernetes_node_provider_ids
      changed_when: false

    - name: Show Kubernetes node status
      ansible.builtin.debug:
        msg: "{{ kubernetes_nodes.stdout_lines }}"
      run_once: true

    - name: Show Kubernetes node provider IDs
      ansible.builtin.debug:
        msg: "{{ kubernetes_node_provider_ids.stdout_lines }}"
      run_once: true