---
- name: Initialize Kubernetes control plane
  hosts: masters
  become: true

  vars:
    pod_network_cidr: "192.168.0.0/16"
    calico_version: "v3.32.0"

  tasks:
    - name: Check if Kubernetes control plane is already initialized
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: kubeadm_admin_conf

    - name: Initialize Kubernetes control plane with kubeadm
      ansible.builtin.command: >
        kubeadm init
        --apiserver-advertise-address={{ ansible_facts.default_ipv4.address }}
        --pod-network-cidr={{ pod_network_cidr }}
      when: not kubeadm_admin_conf.stat.exists
      register: kubeadm_init_result

    - name: Ensure .kube directory exists for ubuntu user
      ansible.builtin.file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy admin kubeconfig to ubuntu user
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        remote_src: true
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    - name: Wait for Kubernetes API server
      ansible.builtin.wait_for:
        host: "{{ ansible_facts.default_ipv4.address }}"
        port: 6443
        timeout: 120

    - name: Install Calico CRDs
      ansible.builtin.command: >
        kubectl apply --server-side -f
        https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/v1_crd_projectcalico_org.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: calico_crds
      changed_when: "'created' in calico_crds.stdout or 'configured' in calico_crds.stdout"

    - name: Install Tigera operator
      ansible.builtin.command: >
        kubectl apply -f
        https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/tigera-operator.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: tigera_operator
      changed_when: "'created' in tigera_operator.stdout or 'configured' in tigera_operator.stdout"

    - name: Download Calico custom resources manifest
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/custom-resources.yaml"
        dest: /tmp/calico-custom-resources.yaml
        mode: "0644"

    - name: Apply Calico custom resources
      ansible.builtin.command: kubectl apply -f /tmp/calico-custom-resources.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: calico_custom_resources
      changed_when: "'created' in calico_custom_resources.stdout or 'configured' in calico_custom_resources.stdout"

    - name: Ensure kubeadm directory exists for ubuntu user
      ansible.builtin.file:
        path: /home/ubuntu/kubeadm
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Generate worker join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: kubeadm_join_command
      changed_when: false

    - name: Save worker join command
      ansible.builtin.copy:
        dest: /home/ubuntu/kubeadm/join-command.sh
        content: "{{ kubeadm_join_command.stdout }}\n"
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Show worker join command
      ansible.builtin.debug:
        msg: "{{ kubeadm_join_command.stdout }}"