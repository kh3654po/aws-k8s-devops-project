---
- name: Initialize Kubernetes control plane
  hosts: masters
  become: true
  gather_facts: true

  vars_files:
    - vars/cluster.yml

  tasks:
    - name: Check whether the control plane is initialized
      ansible.builtin.stat:
        path: "{{ kubeconfig_path }}"
      register: kubeadm_admin_conf

    - name: Render kubeadm initialization configuration
      ansible.builtin.template:
        src: kubeadm-init-config.yml.j2
        dest: /tmp/kubeadm-init-config.yml
        owner: root
        group: root
        mode: "0600"
      when: not kubeadm_admin_conf.stat.exists

    - name: Initialize Kubernetes control plane with kubeadm
      ansible.builtin.command:
        argv:
          - kubeadm
          - init
          - --config
          - /tmp/kubeadm-init-config.yml
      when: not kubeadm_admin_conf.stat.exists
      register: kubeadm_init_result

    - name: Ensure Kubernetes config directory exists for ubuntu user
      ansible.builtin.file:
        path: "/home/{{ kubernetes_admin_user }}/.kube"
        state: directory
        owner: "{{ kubernetes_admin_user }}"
        group: "{{ kubernetes_admin_user }}"
        mode: "0700"

    - name: Copy admin kubeconfig for ubuntu user
      ansible.builtin.copy:
        src: "{{ kubeconfig_path }}"
        dest: "{{ kubernetes_user_kubeconfig }}"
        remote_src: true
        owner: "{{ kubernetes_admin_user }}"
        group: "{{ kubernetes_admin_user }}"
        mode: "0600"

    - name: Wait for Kubernetes API server
      ansible.builtin.wait_for:
        host: "{{ ansible_facts['default_ipv4']['address'] }}"
        port: 6443
        timeout: 120

    - name: Verify Kubernetes API server access
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - nodes
          - -o
          - wide
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: control_plane_nodes
      changed_when: false

    - name: Show control plane status
      ansible.builtin.debug:
        msg: "{{ control_plane_nodes.stdout_lines }}"