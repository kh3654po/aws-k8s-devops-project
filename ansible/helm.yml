---
- name: Install Helm on Kubernetes control plane
  hosts: masters
  become: true
  gather_facts: true

  vars:
    helm_version: "v4.2.1"
    helm_install_dir: /usr/local/bin
    helm_binary_path: "{{ helm_install_dir }}/helm"
    helm_download_dir: /tmp/helm-install
    kubeconfig_path: /etc/kubernetes/admin.conf

    helm_architecture_map:
      x86_64: amd64
      aarch64: arm64
      armv7l: arm

  tasks:
    - name: Validate Helm architecture support
      ansible.builtin.assert:
        that:
          - ansible_facts["architecture"] in helm_architecture_map
        fail_msg: >-
          Unsupported CPU architecture:
          {{ ansible_facts["architecture"] }}
        success_msg: >-
          CPU architecture {{ ansible_facts["architecture"] }}
          is supported by this Helm installation playbook

    - name: Set Helm download architecture
      ansible.builtin.set_fact:
        helm_architecture: >-
          {{
            helm_architecture_map[
              ansible_facts["architecture"]
            ]
          }}

    - name: Set Helm download information
      ansible.builtin.set_fact:
        helm_archive_name: >-
          helm-{{ helm_version }}-linux-{{ helm_architecture }}.tar.gz
        helm_archive_path: >-
          {{ helm_download_dir }}/helm-{{ helm_version }}-linux-{{ helm_architecture }}.tar.gz
        helm_checksum_path: >-
          {{ helm_download_dir }}/helm-{{ helm_version }}-linux-{{ helm_architecture }}.tar.gz.sha256sum
        helm_download_url: >-
          https://get.helm.sh/helm-{{ helm_version }}-linux-{{ helm_architecture }}.tar.gz
        helm_checksum_url: >-
          https://get.helm.sh/helm-{{ helm_version }}-linux-{{ helm_architecture }}.tar.gz.sha256sum
        helm_extracted_binary_path: >-
          {{ helm_download_dir }}/linux-{{ helm_architecture }}/helm

    - name: Check currently installed Helm version
      ansible.builtin.command:
        argv:
          - "{{ helm_binary_path }}"
          - version
          - --short
      register: helm_current_version
      changed_when: false
      failed_when: false

    - name: Determine whether Helm installation is required
      ansible.builtin.set_fact:
        helm_install_required: >-
          {{
            helm_current_version.rc != 0
            or helm_version not in helm_current_version.stdout
          }}

    - name: Show current Helm installation state
      ansible.builtin.debug:
        msg: >-
          {{
            "Helm " ~ helm_version ~ " will be installed"
            if helm_install_required
            else "Helm " ~ helm_version ~ " is already installed"
          }}

    - name: Ensure Helm installation directory exists
      ansible.builtin.file:
        path: "{{ helm_install_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Remove previous Helm temporary directory
      ansible.builtin.file:
        path: "{{ helm_download_dir }}"
        state: absent
      when: helm_install_required

    - name: Create Helm temporary directory
      ansible.builtin.file:
        path: "{{ helm_download_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: helm_install_required

    - name: Download Helm SHA-256 checksum
      ansible.builtin.get_url:
        url: "{{ helm_checksum_url }}"
        dest: "{{ helm_checksum_path }}"
        mode: "0644"
      when: helm_install_required

    - name: Read Helm SHA-256 checksum
      ansible.builtin.slurp:
        src: "{{ helm_checksum_path }}"
      register: helm_checksum_file
      when: helm_install_required

    - name: Extract Helm SHA-256 checksum value
      ansible.builtin.set_fact:
        helm_archive_checksum: >-
          {{
            (
              helm_checksum_file.content
              | b64decode
            ).split()[0]
          }}
      when: helm_install_required

    - name: Download and verify Helm archive
      ansible.builtin.get_url:
        url: "{{ helm_download_url }}"
        dest: "{{ helm_archive_path }}"
        checksum: "sha256:{{ helm_archive_checksum }}"
        mode: "0644"
      when: helm_install_required

    - name: Extract Helm archive
      ansible.builtin.unarchive:
        src: "{{ helm_archive_path }}"
        dest: "{{ helm_download_dir }}"
        remote_src: true
      when: helm_install_required

    - name: Install Helm binary
      ansible.builtin.copy:
        src: "{{ helm_extracted_binary_path }}"
        dest: "{{ helm_binary_path }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      when: helm_install_required

    - name: Remove Helm temporary directory
      ansible.builtin.file:
        path: "{{ helm_download_dir }}"
        state: absent
      when: helm_install_required

    - name: Verify installed Helm version
      ansible.builtin.command:
        argv:
          - "{{ helm_binary_path }}"
          - version
          - --short
      register: helm_installed_version
      changed_when: false
      failed_when: helm_version not in helm_installed_version.stdout

    - name: Show installed Helm version
      ansible.builtin.debug:
        msg: "{{ helm_installed_version.stdout }}"

    - name: Verify Helm access to Kubernetes cluster
      ansible.builtin.command:
        argv:
          - "{{ helm_binary_path }}"
          - list
          - --all-namespaces
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: helm_release_list
      changed_when: false

    - name: Show Helm releases
      ansible.builtin.debug:
        msg: >-
          {{
            helm_release_list.stdout_lines
            if helm_release_list.stdout_lines | length > 0
            else ["No Helm releases are currently installed"]
          }}