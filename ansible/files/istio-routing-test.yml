---
apiVersion: v1
kind: ConfigMap
metadata:
  name: istio-routing-demo-v1
data:
  index.html: |
    version=v1

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: istio-routing-demo-v2
data:
  index.html: |
    version=v2

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: istio-routing-demo

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: istio-routing-demo-v1
  labels:
    app: istio-routing-demo
    version: v1

spec:
  replicas: 2

  selector:
    matchLabels:
      app: istio-routing-demo
      version: v1

  template:
    metadata:
      labels:
        app: istio-routing-demo
        version: v1

    spec:
      serviceAccountName: istio-routing-demo

      containers:
        - name: nginx
          image: nginx:1.27-alpine

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: content
          configMap:
            name: istio-routing-demo-v1

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: istio-routing-demo-v2
  labels:
    app: istio-routing-demo
    version: v2

spec:
  replicas: 2

  selector:
    matchLabels:
      app: istio-routing-demo
      version: v2

  template:
    metadata:
      labels:
        app: istio-routing-demo
        version: v2

    spec:
      serviceAccountName: istio-routing-demo

      containers:
        - name: nginx
          image: nginx:1.27-alpine

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: content
          configMap:
            name: istio-routing-demo-v2

---
apiVersion: v1
kind: Service
metadata:
  name: istio-routing-demo

spec:
  type: ClusterIP

  selector:
    app: istio-routing-demo

  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP