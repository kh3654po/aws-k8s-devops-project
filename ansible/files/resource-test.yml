---
apiVersion: v1
kind: Pod
metadata:
  name: oom-test
  namespace: resilience-test
  labels:
    app: oom-test
spec:
  restartPolicy: Never

  containers:
    - name: memory-hog
      image: python:3.13-alpine

      resources:
        requests:
          cpu: 50m
          memory: 32Mi

        limits:
          cpu: 200m
          memory: 64Mi

      command:
        - python
        - -c

      args:
        - |
          import time

          print("OOM test begins", flush=True)

          time.sleep(5)

          print("Allocating 128 MiB", flush=True)

          data = bytearray(128 * 1024 * 1024)

          print("Allocation completed", flush=True)

          time.sleep(300)

---
apiVersion: v1
kind: Pod
metadata:
  name: cpu-throttle-test
  namespace: resilience-test
  labels:
    app: cpu-throttle-test
spec:
  restartPolicy: Never

  containers:
    - name: cpu-hog
      image: python:3.13-alpine

      resources:
        requests:
          cpu: 50m
          memory: 32Mi

        limits:
          cpu: 100m
          memory: 64Mi

      command:
        - python
        - -c

      args:
        - |
          print("CPU throttle test begins", flush=True)

          while True:
              pass

---
apiVersion: v1
kind: Pod
metadata:
  name: unschedulable-test
  namespace: resilience-test
  labels:
    app: unschedulable-test
spec:
  restartPolicy: Never

  containers:
    - name: nginx
      image: nginx:1.27-alpine

      resources:
        requests:
          cpu: "1000"
          memory: 1Ti