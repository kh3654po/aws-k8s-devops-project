---
apiVersion: v1
kind: Namespace
metadata:
  name: logging-test

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-generator
  namespace: logging-test
  labels:
    app: log-generator

spec:
  replicas: 1

  selector:
    matchLabels:
      app: log-generator

  template:
    metadata:
      labels:
        app: log-generator

    spec:
      containers:
        - name: log-generator
          image: busybox:1.37

          command:
            - /bin/sh
            - -c

          args:
            - |
              counter=0

              while true; do
                counter=$((counter + 1))

                timestamp="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

                echo "${timestamp} level=INFO service=log-generator message=\"application heartbeat\" counter=${counter}"

                if [ $((counter % 3)) -eq 0 ]; then
                  echo "${timestamp} level=WARN service=log-generator message=\"slow request detected\" path=/api/orders duration_ms=850"
                fi

                if [ $((counter % 5)) -eq 0 ]; then
                  echo "${timestamp} level=ERROR service=log-generator message=\"request failed\" path=/api/payment status=500"
                fi

                if [ $((counter % 7)) -eq 0 ]; then
                  echo "{\"timestamp\":\"${timestamp}\",\"level\":\"ERROR\",\"service\":\"payment\",\"method\":\"POST\",\"path\":\"/api/payment\",\"status\":503,\"message\":\"payment service unavailable\"}"
                fi

                sleep 5
              done