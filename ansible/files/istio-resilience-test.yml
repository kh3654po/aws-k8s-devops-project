---
apiVersion: v1
kind: ConfigMap
metadata:
  name: istio-resilience-demo
data:
  server.py: |
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from urllib.parse import urlparse, parse_qs
    import time

    class Handler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def log_message(self, format, *args):
            print(
                "%s - - [%s] %s"
                % (
                    self.client_address[0],
                    self.log_date_time_string(),
                    format % args,
                ),
                flush=True,
            )

        def respond(self, status, body):
            payload = body.encode("utf-8")

            self.send_response(status)
            self.send_header("Content-Type", "text/plain")
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()

            self.wfile.write(payload)

        def do_GET(self):
            parsed = urlparse(self.path)
            path = parsed.path
            query = parse_qs(parsed.query)

            attempt = self.headers.get(
                "x-envoy-attempt-count",
                "1",
            )

            if path == "/healthz":
                self.respond(
                    200,
                    "healthy\n",
                )
                return

            if path == "/retry":
                attempt_number = int(attempt)

                if attempt_number == 1:
                    self.respond(
                        503,
                        "retry attempt=1 status=503\n",
                    )
                    return

                self.respond(
                    200,
                    f"retry attempt={attempt_number} status=200\n",
                )
                return

            if path == "/slow":
                seconds = float(
                    query.get("seconds", ["3"])[0]
                )

                time.sleep(seconds)

                self.respond(
                    200,
                    f"slow seconds={seconds}\n",
                )
                return

            if path == "/hold":
                seconds = float(
                    query.get("seconds", ["3"])[0]
                )

                time.sleep(seconds)

                self.respond(
                    200,
                    f"hold seconds={seconds}\n",
                )
                return

            if path == "/fault-delay":
                self.respond(
                    200,
                    "fault-delay backend reached\n",
                )
                return

            if path == "/fault-abort":
                self.respond(
                    200,
                    "fault-abort backend reached\n",
                )
                return

            self.respond(
                200,
                "istio-resilience-demo\n",
            )

    server = ThreadingHTTPServer(
        ("0.0.0.0", 8080),
        Handler,
    )

    print(
        "Listening on :8080",
        flush=True,
    )

    server.serve_forever()

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: istio-resilience-demo

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: istio-resilience-demo
  labels:
    app: istio-resilience-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: istio-resilience-demo

  template:
    metadata:
      labels:
        app: istio-resilience-demo

    spec:
      serviceAccountName: istio-resilience-demo

      containers:
        - name: resilience-server
          image: python:3.12-alpine

          command:
            - python
            - /app/server.py

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          volumeMounts:
            - name: application
              mountPath: /app/server.py
              subPath: server.py

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: application
          configMap:
            name: istio-resilience-demo

---
apiVersion: v1
kind: Service
metadata:
  name: istio-resilience-demo

spec:
  type: ClusterIP

  selector:
    app: istio-resilience-demo

  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP