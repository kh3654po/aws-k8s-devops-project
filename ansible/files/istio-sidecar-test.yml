---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: istio-client
  labels:
    mesh-test: "true"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: istio-nginx
  labels:
    mesh-test: "true"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: istio-nginx
  labels:
    app: istio-nginx
    version: v1
    mesh-test: "true"
spec:
  replicas: 1

  selector:
    matchLabels:
      app: istio-nginx

  template:
    metadata:
      labels:
        app: istio-nginx
        version: v1
        mesh-test: "true"

    spec:
      serviceAccountName: istio-nginx

      containers:
        - name: istio-nginx
          image: nginx:1.27-alpine

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /
              port: http

            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: http

            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: istio-nginx
  labels:
    app: istio-nginx
    mesh-test: "true"

spec:
  selector:
    app: istio-nginx

  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: istio-client
  labels:
    app: istio-client
    version: v1
    mesh-test: "true"

spec:
  replicas: 1

  selector:
    matchLabels:
      app: istio-client

  template:
    metadata:
      labels:
        app: istio-client
        version: v1
        mesh-test: "true"

    spec:
      serviceAccountName: istio-client

      containers:
        - name: istio-client
          image: curlimages/curl:8.12.1

          command:
            - /bin/sh
            - -c

          args:
            - |
              while true; do
                sleep 3600
              done

          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi