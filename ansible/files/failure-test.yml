---
apiVersion: v1
kind: Namespace
metadata:
  name: failure-test

---
apiVersion: v1
kind: Pod
metadata:
  name: image-pull-failure
  namespace: failure-test
  labels:
    app: image-pull-failure

spec:
  restartPolicy: Always

  containers:
    - name: application
      image: does-not-exist.invalid/failure-test:1.0

---
apiVersion: v1
kind: Pod
metadata:
  name: crash-loop-test
  namespace: failure-test
  labels:
    app: crash-loop-test

spec:
  restartPolicy: Always

  containers:
    - name: application
      image: busybox:1.37

      command:
        - /bin/sh
        - -c

      args:
        - |
          echo "application starting"
          echo "fatal: simulated application failure" >&2
          sleep 2
          exit 1

---
apiVersion: v1
kind: Pod
metadata:
  name: readiness-failure
  namespace: failure-test
  labels:
    app: readiness-failure

spec:
  restartPolicy: Always

  containers:
    - name: application
      image: nginx:1.27-alpine

      ports:
        - containerPort: 80

      readinessProbe:
        httpGet:
          path: /this-path-does-not-exist
          port: 80

        initialDelaySeconds: 3
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 2