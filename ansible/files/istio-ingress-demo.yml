---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: istio-ingress-demo

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: istio-ingress-demo
data:
  index.html: |
    ingress-gateway-ok

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: istio-ingress-demo

  labels:
    app: istio-ingress-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: istio-ingress-demo

  template:
    metadata:
      labels:
        app: istio-ingress-demo
        version: v1

    spec:
      serviceAccountName: istio-ingress-demo

      containers:
        - name: istio-ingress-demo
          image: nginx:1.27-alpine

          ports:
            - name: http
              containerPort: 80

          volumeMounts:
            - name: nginx-index
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true

          resources:
            requests:
              cpu: 25m
              memory: 32Mi

            limits:
              cpu: 200m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /
              port: http

            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: http

            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: nginx-index
          configMap:
            name: istio-ingress-demo

---
apiVersion: v1
kind: Service
metadata:
  name: istio-ingress-demo

spec:
  selector:
    app: istio-ingress-demo

  ports:
    - name: http
      port: 80
      targetPort: http