[masters]
master ansible_host=<MASTER_PUBLIC_IP>

[workers]
worker1 ansible_host=<WORKER_1_PRIVATE_IP>
worker2 ansible_host=<WORKER_2_PRIVATE_IP>

[k8s:children]
masters
workers

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/<YOUR_KEY_FILE>.pem
ansible_ssh_common_args='-o IdentitiesOnly=yes'

[workers:vars]
ansible_ssh_common_args='-o IdentitiesOnly=yes -o ProxyCommand="ssh -i ~/.ssh/<YOUR_KEY_FILE>.pem -o IdentitiesOnly=yes -W %h:%p ubuntu@<MASTER_PUBLIC_IP>"'