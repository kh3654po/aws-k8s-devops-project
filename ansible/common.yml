---
- name: Configure common Kubernetes node prerequisites
  hosts: k8s
  become: true

  vars:
    kubernetes_version: "v1.36"
    kubernetes_apt_keyring: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    kubernetes_apt_repo: "deb [signed-by={{ kubernetes_apt_keyring }}] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/ /"

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
        enabled: true

    - name: Restart kubelet
      ansible.builtin.systemd:
        name: kubelet
        state: restarted
        enabled: true

  tasks:
    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

    - name: Disable swap immediately
      ansible.builtin.command: swapoff -a
      when: ansible_facts["swaptotal_mb"] | int > 0

    - name: Disable swap permanently in /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Configure Kubernetes kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        mode: "0644"
        content: |
          overlay
          br_netfilter

    - name: Load overlay module
      community.general.modprobe:
        name: overlay
        state: present

    - name: Load br_netfilter module
      community.general.modprobe:
        name: br_netfilter
        state: present

    - name: Configure Kubernetes sysctl settings
      ansible.builtin.copy:
        dest: /etc/sysctl.d/k8s.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1

    - name: Apply Kubernetes sysctl settings
      ansible.builtin.command:
        argv:
          - sysctl
          - --system
      changed_when: false

    - name: Verify IPv4 forwarding
      ansible.builtin.command:
        argv:
          - sysctl
          - -n
          - net.ipv4.ip_forward
      register: kubernetes_ip_forward
      changed_when: false
      failed_when: kubernetes_ip_forward.stdout | trim != "1"

    - name: Install containerd and required packages
      ansible.builtin.apt:
        name:
          - containerd
          - apt-transport-https
          - ca-certificates
          - curl
          - gpg
        state: present
        update_cache: true

    - name: Ensure containerd config directory exists
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: "0755"

    - name: Generate default containerd config
      ansible.builtin.command: containerd config default
      register: containerd_default_config
      changed_when: false

    - name: Write containerd config
      ansible.builtin.copy:
        dest: /etc/containerd/config.toml
        mode: "0644"
        content: "{{ containerd_default_config.stdout }}"
      notify: Restart containerd

    - name: Enable systemd cgroup driver for containerd
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'
      notify: Restart containerd

    - name: Ensure containerd is enabled and started
      ansible.builtin.systemd:
        name: containerd
        state: started
        enabled: true

    - name: Ensure apt keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Check Kubernetes apt keyring
      ansible.builtin.stat:
        path: "{{ kubernetes_apt_keyring }}"
      register: kubernetes_keyring_stat

    - name: Download Kubernetes apt repository key
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/Release.key"
        dest: /tmp/kubernetes-release.key
        mode: "0644"
      register: kubernetes_key_download

    - name: Install Kubernetes apt keyring
      ansible.builtin.command:
        cmd: "gpg --batch --yes --dearmor -o {{ kubernetes_apt_keyring }} /tmp/kubernetes-release.key"
      when: kubernetes_key_download.changed or not kubernetes_keyring_stat.stat.exists

    - name: Add Kubernetes apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        mode: "0644"
        content: "{{ kubernetes_apt_repo }}\n"
      register: kubernetes_repo

    - name: Update apt cache after adding Kubernetes repository
      ansible.builtin.apt:
        update_cache: true
      when: kubernetes_repo.changed or kubernetes_key_download.changed

    - name: Install Kubernetes packages
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: true

    - name: Get EC2 IMDSv2 token
      ansible.builtin.uri:
        url: http://169.254.169.254/latest/api/token
        method: PUT
        headers:
          X-aws-ec2-metadata-token-ttl-seconds: "21600"
        return_content: true
      register: ec2_imds_token

    - name: Get EC2 local hostname
      ansible.builtin.uri:
        url: http://169.254.169.254/latest/meta-data/local-hostname
        method: GET
        headers:
          X-aws-ec2-metadata-token: "{{ ec2_imds_token.content }}"
        return_content: true
      register: ec2_local_hostname

    - name: Store Kubernetes node name
      ansible.builtin.set_fact:
        kubernetes_node_name: "{{ ec2_local_hostname.content | trim }}"

    - name: Show Kubernetes node name
      ansible.builtin.debug:
        msg: "Kubernetes node name: {{ kubernetes_node_name }}"

    - name: Configure kubelet for AWS external cloud provider
      ansible.builtin.copy:
        dest: /etc/default/kubelet
        owner: root
        group: root
        mode: "0644"
        content: |
          KUBELET_EXTRA_ARGS=--cloud-provider=external --hostname-override={{ kubernetes_node_name }}
      notify: Restart kubelet

    - name: Hold Kubernetes packages
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Enable kubelet
      ansible.builtin.systemd:
        name: kubelet
        enabled: true

    - name: Mark common setup as completed
      ansible.builtin.file:
        path: /var/log/k8s-common-setup-done
        state: touch
        mode: "0644"