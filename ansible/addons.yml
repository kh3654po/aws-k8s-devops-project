---
- name: Install Kubernetes cluster add-ons
  hosts: masters
  become: true
  gather_facts: false

  vars_files:
    - vars/cluster.yml

  tasks:
    - name: Check Kubernetes administrator kubeconfig
      ansible.builtin.stat:
        path: "{{ kubeconfig_path }}"
      register: addons_kubeconfig

    - name: Fail when Kubernetes control plane is not initialized
      ansible.builtin.assert:
        that:
          - addons_kubeconfig.stat.exists
        fail_msg: >-
          Kubernetes administrator kubeconfig was not found at
          {{ kubeconfig_path }}.
          Run master.yml before addons.yml.
        success_msg: >-
          Kubernetes administrator kubeconfig was found.

    - name: Check Helm binary
      ansible.builtin.stat:
        path: "{{ helm_binary_path }}"
      register: addons_helm_binary

    - name: Fail when Helm is not installed
      ansible.builtin.assert:
        that:
          - addons_helm_binary.stat.exists
          - addons_helm_binary.stat.executable
        fail_msg: >-
          Helm executable was not found at {{ helm_binary_path }}.
          Run helm.yml before addons.yml.
        success_msg: >-
          Helm executable was found.

    - name: Install Python YAML library for Kubernetes collection
      ansible.builtin.apt:
        name: python3-yaml
        state: present
        update_cache: true

    - name: Add Project Calico Helm repository
      kubernetes.core.helm_repository:
        name: "{{ calico_repository_name }}"
        repo_url: "{{ calico_repository_url }}"
        binary_path: "{{ helm_binary_path }}"
        repo_state: present
        force_update: true

    - name: Create Tigera Operator namespace
      ansible.builtin.shell: |
        set -o pipefail

        kubectl create namespace {{ calico_release_namespace }} \
          --dry-run=client \
          --output=yaml |
        kubectl apply --filename=-
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: tigera_namespace_apply
      changed_when: >-
        'created' in tigera_namespace_apply.stdout or
        'configured' in tigera_namespace_apply.stdout

    - name: Render and apply Calico custom resource definitions
      ansible.builtin.shell: |
        set -o pipefail

        {{ helm_binary_path }} template calico-crds \
          {{ calico_crd_chart }} \
          --version {{ calico_version }} |
        kubectl apply \
          --server-side \
          --filename=-
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: calico_crds_apply
      changed_when: false

    - name: Render Calico Helm values
      ansible.builtin.template:
        src: calico-values.yml.j2
        dest: "{{ calico_values_remote_path }}"
        owner: root
        group: root
        mode: "0600"

    - name: Install or upgrade Calico Helm release
      kubernetes.core.helm:
        name: "{{ calico_release_name }}"
        chart_ref: "{{ calico_operator_chart }}"
        chart_version: "{{ calico_version }}"
        release_namespace: "{{ calico_release_namespace }}"
        create_namespace: true
        release_state: present

        values_files:
          - "{{ calico_values_remote_path }}"

        kubeconfig: "{{ kubeconfig_path }}"
        binary_path: "{{ helm_binary_path }}"

        update_repo_cache: true
        reset_values: true
        wait: true
        timeout: 10m0s
        history_max: 10

      register: calico_helm_release

    - name: Show Calico Helm release result
      ansible.builtin.debug:
        msg:
          - "Release: {{ calico_helm_release.status.name }}"
          - "Namespace: {{ calico_helm_release.status.namespace }}"
          - "Chart: {{ calico_helm_release.status.chart }}"
          - "Revision: {{ calico_helm_release.status.revision }}"
          - "Status: {{ calico_helm_release.status.status }}"

    - name: Wait for Tigera Operator deployment
      ansible.builtin.command:
        argv:
          - kubectl
          - rollout
          - status
          - deployment/tigera-operator
          - --namespace
          - "{{ calico_release_namespace }}"
          - --timeout=300s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false

    - name: Wait for Calico Node DaemonSet to be created
      ansible.builtin.shell: |
        set -o pipefail

        for i in $(seq 1 60); do
          if kubectl get daemonset calico-node \
            --namespace calico-system \
            >/dev/null 2>&1; then
            exit 0
          fi

          sleep 5
        done

        echo "Calico Node DaemonSet was not created before timeout."
        exit 1
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false

    - name: Wait for Calico Node DaemonSet rollout
      ansible.builtin.command:
        argv:
          - kubectl
          - rollout
          - status
          - daemonset/calico-node
          - --namespace
          - calico-system
          - --timeout=300s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false

    - name: Get Calico installation configuration
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - installation
          - default
          - --output
          - yaml
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: calico_installation
      changed_when: false

    - name: Get Calico Pod status
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - pods
          - --namespace
          - calico-system
          - --output
          - wide
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: calico_pods
      changed_when: false

    - name: Show Calico Pod status
      ansible.builtin.debug:
        msg: "{{ calico_pods.stdout_lines }}"