---
- name: Configure Amazon ECR credential provider on Kubernetes workers
  hosts: workers
  become: true
  gather_facts: true

  vars_files:
    - vars/cluster.yml

  handlers:
    - name: Restart kubelet
      ansible.builtin.systemd:
        name: kubelet
        state: restarted
        enabled: true

  tasks:
    - name: Validate ECR credential provider architecture
      ansible.builtin.assert:
        that:
          - >-
            ansible_facts["architecture"]
            in ecr_credential_provider_architecture_map
        fail_msg: >-
          Unsupported architecture:
          {{ ansible_facts["architecture"] }}

    - name: Set ECR credential provider architecture
      ansible.builtin.set_fact:
        ecr_credential_provider_architecture: >-
          {{
            ecr_credential_provider_architecture_map[
              ansible_facts["architecture"]
            ]
          }}

    - name: Set ECR credential provider download URL
      ansible.builtin.set_fact:
        ecr_credential_provider_download_url: >-
          {{
            ecr_credential_provider_base_url
          }}/{{ ecr_credential_provider_version }}/linux/{{
            ecr_credential_provider_architecture
          }}/ecr-credential-provider-linux-{{
            ecr_credential_provider_architecture
          }}

    - name: Check installed ECR credential provider version
      ansible.builtin.command:
        argv:
          - "{{ ecr_credential_provider_binary }}"
          - --version
      register: ecr_credential_provider_current_version
      changed_when: false
      failed_when: false

    - name: Determine whether ECR credential provider installation is required
      ansible.builtin.set_fact:
        ecr_credential_provider_install_required: >-
          {{
            ecr_credential_provider_current_version.rc != 0
            or
            ecr_credential_provider_version
            not in ecr_credential_provider_current_version.stdout
          }}

    - name: Ensure ECR credential provider binary directory exists
      ansible.builtin.file:
        path: "{{ ecr_credential_provider_install_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download ECR credential provider
      ansible.builtin.get_url:
        url: "{{ ecr_credential_provider_download_url }}"
        dest: "{{ ecr_credential_provider_binary }}"
        owner: root
        group: root
        mode: "0755"
      when: ecr_credential_provider_install_required

    - name: Ensure ECR credential provider config directory exists
      ansible.builtin.file:
        path: "{{ ecr_credential_provider_config_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Render ECR CredentialProviderConfig
      ansible.builtin.template:
        src: templates/ecr-credential-provider-config.yml.j2
        dest: "{{ ecr_credential_provider_config }}"
        owner: root
        group: root
        mode: "0644"
      notify: Restart kubelet

    - name: Get EC2 IMDSv2 token
      ansible.builtin.uri:
        url: http://169.254.169.254/latest/api/token
        method: PUT

        headers:
          X-aws-ec2-metadata-token-ttl-seconds: "21600"

        return_content: true
      register: ecr_imds_token

    - name: Get EC2 local hostname
      ansible.builtin.uri:
        url: http://169.254.169.254/latest/meta-data/local-hostname
        method: GET

        headers:
          X-aws-ec2-metadata-token: "{{ ecr_imds_token.content }}"

        return_content: true
      register: ecr_local_hostname

    - name: Configure kubelet ECR credential provider
      ansible.builtin.copy:
        dest: /etc/default/kubelet
        owner: root
        group: root
        mode: "0644"

        content: >-
          KUBELET_EXTRA_ARGS=--cloud-provider=external
          --hostname-override={{ ecr_local_hostname.content | trim }}
          --image-credential-provider-config={{ ecr_credential_provider_config }}
          --image-credential-provider-bin-dir={{ ecr_credential_provider_install_dir }}

      notify: Restart kubelet

    - name: Apply kubelet configuration immediately
      ansible.builtin.meta: flush_handlers

    - name: Ensure kubelet is running
      ansible.builtin.systemd:
        name: kubelet
        state: started
        enabled: true

    - name: Verify ECR credential provider version
      ansible.builtin.command:
        argv:
          - "{{ ecr_credential_provider_binary }}"
          - --version
      register: ecr_credential_provider_installed_version
      changed_when: false
      failed_when: >-
        ecr_credential_provider_version
        not in ecr_credential_provider_installed_version.stdout

    - name: Show ECR credential provider version
      ansible.builtin.debug:
        msg: "{{ ecr_credential_provider_installed_version.stdout }}"


- name: Verify Kubernetes worker nodes after kubelet restart
  hosts: masters
  become: true
  gather_facts: false

  vars_files:
    - vars/cluster.yml

  tasks:
    - name: Wait for all Kubernetes nodes to become Ready
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - --for=condition=Ready
          - nodes
          - --all
          - --timeout=300s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false

    - name: Get Kubernetes nodes
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - nodes
          - -o
          - wide
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: ecr_kubernetes_nodes
      changed_when: false

    - name: Show Kubernetes nodes
      ansible.builtin.debug:
        msg: "{{ ecr_kubernetes_nodes.stdout_lines }}"