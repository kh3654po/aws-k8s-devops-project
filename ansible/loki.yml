---
- name: Install Loki logging stack
  hosts: masters
  become: true
  gather_facts: false

  vars_files:
    - vars/cluster.yml

  tasks:
    - name: Check Kubernetes administrator kubeconfig
      ansible.builtin.stat:
        path: "{{ kubeconfig_path }}"
      register: loki_kubeconfig

    - name: Fail when Kubernetes control plane is not initialized
      ansible.builtin.assert:
        that:
          - loki_kubeconfig.stat.exists
        fail_msg: >-
          Kubernetes administrator kubeconfig was not found at
          {{ kubeconfig_path }}.
        success_msg: Kubernetes administrator kubeconfig was found.

    - name: Check Helm installation
      ansible.builtin.command:
        argv:
          - helm
          - version
          - --short
      register: loki_helm_version
      changed_when: false

    - name: Show Helm version
      ansible.builtin.debug:
        msg: "{{ loki_helm_version.stdout }}"

    - name: Check monitoring namespace
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - namespace
          - "{{ loki_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: loki_namespace_status
      changed_when: false
      failed_when: false

    - name: Create monitoring namespace
      ansible.builtin.command:
        argv:
          - kubectl
          - create
          - namespace
          - "{{ loki_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      when: loki_namespace_status.rc != 0

    - name: Add Grafana Community Helm repository
      ansible.builtin.command:
        argv:
          - helm
          - repo
          - add
          - "{{ loki_repository_name }}"
          - "{{ loki_repository_url }}"
          - --force-update
      register: loki_helm_repository
      changed_when: >-
        'has been added' in loki_helm_repository.stdout

    - name: Update Helm repositories
      ansible.builtin.command:
        argv:
          - helm
          - repo
          - update
      changed_when: false

    - name: Validate Loki chart version
      ansible.builtin.assert:
        that:
          - loki_chart_version is defined
          - loki_chart_version | length > 0
        fail_msg: >-
          Loki chart version is empty.
          Configure loki_chart_version in vars/cluster.yml.

    - name: Verify Loki chart version
      ansible.builtin.command:
        argv:
          - helm
          - show
          - chart
          - "{{ loki_chart }}"
          - --version
          - "{{ loki_chart_version }}"
      register: loki_chart_information
      changed_when: false

    - name: Show Loki chart information
      ansible.builtin.debug:
        msg: "{{ loki_chart_information.stdout_lines }}"

    - name: Render Loki Helm values
      ansible.builtin.template:
        src: templates/loki-values.yml.j2
        dest: "{{ loki_values_remote_path }}"
        owner: root
        group: root
        mode: "0600"

    - name: Validate Loki Helm template
      ansible.builtin.command:
        argv:
          - helm
          - template
          - "{{ loki_release_name }}"
          - "{{ loki_chart }}"
          - --version
          - "{{ loki_chart_version }}"
          - --namespace
          - "{{ loki_namespace }}"
          - --values
          - "{{ loki_values_remote_path }}"
      changed_when: false

    - name: Install or upgrade Loki
      ansible.builtin.command:
        argv:
          - helm
          - upgrade
          - --install
          - "{{ loki_release_name }}"
          - "{{ loki_chart }}"
          - --version
          - "{{ loki_chart_version }}"
          - --namespace
          - "{{ loki_namespace }}"
          - --values
          - "{{ loki_values_remote_path }}"
          - --wait
          - --atomic
          - --timeout
          - 10m
          - --history-max
          - "10"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: loki_helm_install

    - name: Show Helm installation result
      ansible.builtin.debug:
        msg: "{{ loki_helm_install.stdout_lines }}"

    - name: Wait for Loki pods to become ready
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - --for=condition=Ready
          - pod
          - -l
          - "app.kubernetes.io/instance={{ loki_release_name }}"
          - --namespace
          - "{{ loki_namespace }}"
          - --timeout=300s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false

    - name: Get Loki workloads
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - deployment,statefulset,daemonset
          - --namespace
          - "{{ loki_namespace }}"
          - -l
          - "app.kubernetes.io/instance={{ loki_release_name }}"
          - -o
          - wide
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: loki_workloads
      changed_when: false

    - name: Get Loki pods
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - pods
          - --namespace
          - "{{ loki_namespace }}"
          - -l
          - "app.kubernetes.io/instance={{ loki_release_name }}"
          - -o
          - wide
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: loki_pods
      changed_when: false

    - name: Get Loki services
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - services
          - --namespace
          - "{{ loki_namespace }}"
          - -l
          - "app.kubernetes.io/instance={{ loki_release_name }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: loki_services
      changed_when: false

    - name: Get Helm release status
      ansible.builtin.command:
        argv:
          - helm
          - status
          - "{{ loki_release_name }}"
          - --namespace
          - "{{ loki_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: loki_helm_status
      changed_when: false

    - name: Show Loki workloads
      ansible.builtin.debug:
        msg: "{{ loki_workloads.stdout_lines }}"

    - name: Show Loki pods
      ansible.builtin.debug:
        msg: "{{ loki_pods.stdout_lines }}"

    - name: Show Loki services
      ansible.builtin.debug:
        msg: "{{ loki_services.stdout_lines }}"

    - name: Show Helm release status
      ansible.builtin.debug:
        msg: "{{ loki_helm_status.stdout_lines }}"