---
# Cluster
cluster_name: ksh-k8s

# Kubernetes Pod 네트워크
pod_network_cidr: "192.168.0.0/16"

# kubeadm 관리자 kubeconfig
kubeconfig_path: /etc/kubernetes/admin.conf

# ubuntu 사용자 kubeconfig
kubernetes_admin_user: ubuntu
kubernetes_user_kubeconfig: /home/ubuntu/.kube/config

# Helm
helm_binary_path: /usr/local/bin/helm

# Calico
calico_version: "v3.32.0"

calico_repository_name: projectcalico
calico_repository_url: https://docs.tigera.io/calico/charts

calico_crd_chart: projectcalico/crd.projectcalico.org.v1
calico_operator_chart: projectcalico/tigera-operator

calico_release_name: calico
calico_release_namespace: tigera-operator

calico_values_remote_path: /tmp/calico-values.yml

calico_encapsulation: VXLAN

# Metrics Server
metrics_server_repository_name: metrics-server
metrics_server_repository_url: https://kubernetes-sigs.github.io/metrics-server/

metrics_server_chart: metrics-server/metrics-server
metrics_server_chart_version: "3.13.1"

metrics_server_release_name: metrics-server
metrics_server_release_namespace: kube-system

# kubeadm의 기본 kubelet serving certificate는 self-signed이므로
# 학습 환경에서 임시로 TLS 인증서 검증을 비활성화한다.
metrics_server_extra_args:
  - --kubelet-insecure-tls

# AWS
aws_region: ap-northeast-2
aws_cli_profile: default

# ASG Worker bootstrap
ssm_join_command_parameter: /ksh/k8s/join-command

# Cluster Autoscaler
cluster_autoscaler_repository_name: autoscaler
cluster_autoscaler_repository_url: https://kubernetes.github.io/autoscaler

cluster_autoscaler_chart: autoscaler/cluster-autoscaler
cluster_autoscaler_chart_version: "9.58.0"

cluster_autoscaler_release_name: cluster-autoscaler
cluster_autoscaler_release_namespace: kube-system

cluster_autoscaler_values_remote_path: /tmp/cluster-autoscaler-values.yml

cluster_autoscaler_image_tag: "v1.36.0"

# ingress-nginx
ingress_nginx_repository_name: ingress-nginx
ingress_nginx_repository_url: https://kubernetes.github.io/ingress-nginx

ingress_nginx_chart: ingress-nginx/ingress-nginx
ingress_nginx_chart_version: "4.15.1"

ingress_nginx_release_name: ingress-nginx
ingress_nginx_release_namespace: ingress-nginx

ingress_nginx_values_remote_path: /tmp/ingress-nginx-values.yml

ingress_nginx_class_name: nginx

ingress_nginx_http_nodeport: 30081
ingress_nginx_https_nodeport: 30443

# AWS Load Balancer Controller
aws_vpc_id: "vpc-083b4d3d26b4e3de0"

aws_load_balancer_controller_repository_name: eks
aws_load_balancer_controller_repository_url: https://aws.github.io/eks-charts

aws_load_balancer_controller_chart: eks/aws-load-balancer-controller
aws_load_balancer_controller_chart_version: "1.14.0"

aws_load_balancer_controller_release_name: aws-load-balancer-controller
aws_load_balancer_controller_release_namespace: kube-system

aws_load_balancer_controller_service_account_name: aws-load-balancer-controller

aws_load_balancer_controller_values_remote_path: /tmp/aws-load-balancer-controller-values.yml

aws_load_balancer_controller_ingress_class: alb

aws_load_balancer_controller_replicas: 1

# Gateway API
gateway_api_version: "v1.5.0"

gateway_api_standard_crds_url: >-
  https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ gateway_api_version }}/standard-install.yaml

aws_load_balancer_controller_gateway_crds_url: >-
  https://raw.githubusercontent.com/kubernetes-sigs/aws-load-balancer-controller/v2.14.0/config/crd/gateway/gateway-crds.yaml

aws_load_balancer_controller_alb_gateway_enabled: true
aws_load_balancer_controller_nlb_gateway_enabled: false

# Monitoring
monitoring_namespace: monitoring

kube_prometheus_stack_repository_name: prometheus-community
kube_prometheus_stack_repository_url: https://prometheus-community.github.io/helm-charts

kube_prometheus_stack_chart: prometheus-community/kube-prometheus-stack
kube_prometheus_stack_chart_version: "88.6.2"

kube_prometheus_stack_release_name: kube-prometheus-stack
kube_prometheus_stack_release_namespace: "{{ monitoring_namespace }}"

kube_prometheus_stack_values_remote_path: /tmp/kube-prometheus-stack-values.yml

# Prometheus
prometheus_replicas: 1
prometheus_retention: 7d
prometheus_scrape_interval: 30s
prometheus_evaluation_interval: 30s

prometheus_persistence_enabled: true
# prometheus_persistence_enabled: false
prometheus_storage_size: 10Gi
prometheus_storage_class_name: "{{ ebs_storage_class_name }}"

prometheus_resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Prometheus Operator
prometheus_operator_resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Alertmanager
alertmanager_replicas: 1

alertmanager_persistence_enabled: false
alertmanager_storage_size: 2Gi

alertmanager_resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

# Grafana
grafana_replicas: 1

grafana_admin_user: admin
grafana_admin_password: change-me-after-install

grafana_persistence_enabled: false
grafana_storage_size: 2Gi

grafana_resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# kube-state-metrics
kube_state_metrics_resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 256Mi

# node-exporter
node_exporter_resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Alertmanager
alertmanager_group_wait: 30s
alertmanager_group_interval: 5m
alertmanager_repeat_interval: 4h

# AWS EBS CSI Driver
ebs_csi_repository_name: aws-ebs-csi-driver
ebs_csi_repository_url: https://kubernetes-sigs.github.io/aws-ebs-csi-driver

ebs_csi_chart: aws-ebs-csi-driver/aws-ebs-csi-driver
ebs_csi_chart_version: "2.65.1"

ebs_csi_release_name: aws-ebs-csi-driver
ebs_csi_namespace: kube-system

ebs_storage_class_name: ebs-gp3
ebs_storage_type: gp3
ebs_storage_reclaim_policy: Delete
ebs_storage_volume_binding_mode: WaitForFirstConsumer

pvc_test_namespace: storage-test
pvc_test_name: ebs-pvc-test
pvc_test_storage_size: 1Gi

# ========================================
# Pre-destroy cleanup
# ========================================
destroy_cleanup_namespaces:
  - monitoring
  - monitoring-app
  - storage-test

destroy_cleanup_timeout: 300

# Thanos
thanos_enabled: true

thanos_object_storage_secret_name: thanos-objstore-config
thanos_object_storage_secret_key: objstore.yml

thanos_s3_region: "{{ aws_region }}"
thanos_s3_endpoint: "s3.{{ aws_region }}.amazonaws.com"

thanos_external_labels:
  cluster: "{{ cluster_name }}"

# Thanos Query
thanos_query_image: quay.io/thanos/thanos:v0.40.1

thanos_query_replicas: 1

thanos_query_service_name: thanos-query

thanos_sidecar_service_name: kube-prometheus-stack-thanos-discovery

thanos_query_grpc_port: 10901
thanos_query_http_port: 10902

thanos_query_resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

# Thanos Store Gateway
thanos_store_enabled: true

thanos_store_image: quay.io/thanos/thanos:v0.40.1

thanos_store_replicas: 1

thanos_store_service_name: thanos-store-gateway

thanos_store_grpc_port: 10901
thanos_store_http_port: 10902

thanos_store_data_dir: /var/thanos/store

thanos_store_resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

# Thanos Compactor
thanos_compactor_enabled: true

thanos_compactor_image: quay.io/thanos/thanos:v0.40.1

thanos_compactor_replicas: 1

thanos_compactor_service_name: thanos-compactor

thanos_compactor_http_port: 10902

thanos_compactor_data_dir: /var/thanos/compact

thanos_compactor_retention_raw: 30d
thanos_compactor_retention_5m: 90d
thanos_compactor_retention_1h: 365d

thanos_compactor_resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Grafana Thanos DataSource
grafana_thanos_datasource_enabled: true

grafana_thanos_datasource_name: Thanos
grafana_thanos_datasource_uid: thanos

grafana_thanos_datasource_url: >-
  http://{{ thanos_query_service_name }}.{{ monitoring_namespace }}.svc.cluster.local:{{ thanos_query_http_port }}

# Loki
loki_enabled: true

loki_namespace: "{{ monitoring_namespace }}"

loki_repository_name: grafana-community
loki_repository_url: https://grafana-community.github.io/helm-charts

loki_chart: grafana-community/loki
loki_chart_version: "18.12.1"

loki_release_name: loki

loki_values_remote_path: /tmp/loki-values.yml

loki_deployment_mode: Monolithic
loki_replicas: 1

loki_http_port: 3100
loki_auth_enabled: false

loki_persistence_enabled: true
loki_storage_class_name: "{{ ebs_storage_class_name }}"
loki_storage_size: 10Gi

# Grafana Alloy
alloy_enabled: true

alloy_namespace: "{{ monitoring_namespace }}"

alloy_repository_name: grafana
alloy_repository_url: https://grafana.github.io/helm-charts

alloy_chart: grafana/alloy
alloy_chart_version: "1.12.1"

alloy_release_name: alloy

alloy_values_remote_path: /tmp/alloy-values.yml

alloy_controller_type: daemonset

alloy_http_port: 12345

alloy_enable_reporting: false

# Grafana Alloy Pod Logs
alloy_mount_varlog: true

alloy_cluster_name: "{{ cluster_name }}"

alloy_loki_write_url: >-
  http://{{ loki_release_name }}-gateway.{{ loki_namespace }}.svc.cluster.local/loki/api/v1/push

# Grafana Alloy - Kubernetes Events
alloy_events_enabled: true

alloy_events_namespace: "{{ monitoring_namespace }}"

alloy_events_release_name: alloy-events

alloy_events_values_remote_path: /tmp/alloy-events-values.yml

alloy_events_controller_type: deployment
alloy_events_replicas: 1

alloy_events_job_name: kubernetes-events
alloy_events_log_format: logfmt

alloy_events_cluster_name: "{{ cluster_name }}"

alloy_events_loki_write_url: >-
  http://{{ loki_release_name }}-gateway.{{ loki_namespace }}.svc.cluster.local/loki/api/v1/push

# Grafana Loki DataSource
grafana_loki_datasource_enabled: true

grafana_loki_datasource_name: Loki

grafana_loki_datasource_uid: loki

grafana_loki_datasource_url: >-
  http://{{ loki_release_name }}-gateway.{{ loki_namespace }}.svc.cluster.local

# AWS Cloud Controller Manager
aws_ccm_repository_name: aws-cloud-controller-manager
aws_ccm_repository_url: https://kubernetes.github.io/cloud-provider-aws

aws_ccm_chart: aws-cloud-controller-manager/aws-cloud-controller-manager
aws_ccm_chart_version: "0.0.11"

aws_ccm_release_name: aws-cloud-controller-manager
aws_ccm_namespace: kube-system

aws_ccm_image_tag: "v1.36.1"

aws_ccm_values_remote_path: /tmp/aws-cloud-controller-manager-values.yml

# Istio Service Mesh
istio_version: "1.31.0"

istio_namespace: istio-system

# Istio Helm Repository
istio_repository_name: istio
istio_repository_url: https://blob.istio.io/istio-release/charts

# Istio Base
istio_base_chart: istio/base
istio_base_release_name: istio-base
istio_base_values_remote_path: /tmp/istio-base-values.yml

# Istio CNI
istio_cni_chart: istio/cni
istio_cni_release_name: istio-cni
istio_cni_values_remote_path: /tmp/istio-cni-values.yml

istio_cni_bin_dir: /opt/cni/bin
istio_cni_conf_dir: /etc/cni/net.d

# Istiod
istiod_chart: istio/istiod
istiod_release_name: istiod
istiod_values_remote_path: /tmp/istiod-values.yml

# Istio Sidecar Test
istio_test_namespace: istio-test

istio_sidecar_test_manifest_local_path: files/istio-sidecar-test.yml
istio_sidecar_test_manifest_remote_path: /tmp/istio-sidecar-test.yml

istio_test_client_app: istio-client
istio_test_server_app: istio-nginx
istio_test_server_service: istio-nginx

# Istio mTLS Test
istio_plain_test_namespace: istio-plain-test

istio_mtls_plain_client_app: istio-plain-client

istio_mtls_plain_client_manifest_local_path: files/istio-mtls-plain-client.yml
istio_mtls_plain_client_manifest_remote_path: /tmp/istio-mtls-plain-client.yml

istio_mtls_strict_manifest_local_path: files/istio-mtls-strict.yml
istio_mtls_strict_manifest_remote_path: /tmp/istio-mtls-strict.yml

# Istio Traffic Routing Test
istio_routing_app: istio-routing-demo
istio_routing_service: istio-routing-demo

istio_routing_workload_manifest_local_path: files/istio-routing-test.yml
istio_routing_workload_manifest_remote_path: /tmp/istio-routing-test.yml

istio_routing_policy_manifest_local_path: files/istio-routing-policy.yml
istio_routing_policy_manifest_remote_path: /tmp/istio-routing-policy.yml

# Istio Resilience Test
istio_resilience_app: istio-resilience-demo
istio_resilience_service: istio-resilience-demo

istio_resilience_workload_manifest_local_path: files/istio-resilience-test.yml
istio_resilience_workload_manifest_remote_path: /tmp/istio-resilience-test.yml

istio_resilience_policy_manifest_local_path: files/istio-resilience-policy.yml
istio_resilience_policy_manifest_remote_path: /tmp/istio-resilience-policy.yml

istio_circuit_breaker_policy_manifest_local_path: files/istio-circuit-breaker-policy.yml
istio_circuit_breaker_policy_manifest_remote_path: /tmp/istio-circuit-breaker-policy.yml